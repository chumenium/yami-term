<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="script-src 'self'">
  <title>Yami Term</title>
  <link rel="stylesheet" href="../node_modules/@xterm/xterm/css/xterm.css">
  <link rel="stylesheet" href="../node_modules/prismjs/themes/prism-tomorrow.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="titlebar">
    <div class="drag-region"></div>
    <div id="tab-bar" class="tab-bar"></div>
    <button id="new-tab-btn" class="new-tab-btn">+</button>
    <div id="launcher-buttons" class="launcher-buttons"></div>
    <button id="settings-btn" class="settings-btn">⚙</button>
  </div>

  <div id="terminals" class="terminals">
    <div id="empty-state" class="empty-state hidden">
      <img src="icon.svg" class="empty-state-icon" alt="yami-term">
      <div class="empty-state-name" id="empty-state-name">yami-term</div>
      <div class="empty-state-version" id="empty-state-version"></div>
      <div class="empty-state-actions">
        <button id="empty-new-tab-btn" class="empty-action-btn">新しいタブ</button>
        <div id="empty-launcher-buttons" class="empty-launcher-buttons"></div>
        <button id="empty-settings-btn" class="empty-action-btn">⚙ 設定</button>
      </div>
    </div>
  </div>

  <div id="settings-modal" class="settings-modal hidden">
    <!-- settings.js が構築する -->
  </div>

  <div id="command-palette" class="command-palette hidden">
    <!-- command-palette.js が構築する -->
  </div>

  <div id="update-modal" class="update-modal hidden">
    <!-- update-popup.js が構築する -->
  </div>

  <div id="search-bar" class="search-bar hidden">
    <!-- search.js が構築する -->
  </div>

  <div id="suggest-layer" class="suggest-layer" style="display: none;">
    <!-- suggest.js が構築する -->
  </div>

  <script src="../node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <script src="../node_modules/@xterm/addon-web-links/lib/addon-web-links.js"></script>
  <script src="../node_modules/@xterm/addon-search/lib/addon-search.js"></script>

  <script src="../node_modules/prismjs/prism.js"></script>
  <script src="../node_modules/prismjs/components/prism-javascript.js"></script>
  <script src="../node_modules/prismjs/components/prism-typescript.js"></script>
  <script src="../node_modules/prismjs/components/prism-python.js"></script>
  <script src="../node_modules/prismjs/components/prism-json.js"></script>
  <script src="../node_modules/prismjs/components/prism-css.js"></script>
  <script src="../node_modules/prismjs/components/prism-markup.js"></script>
  <script src="../node_modules/prismjs/components/prism-bash.js"></script>
  <script src="../node_modules/prismjs/components/prism-yaml.js"></script>
  <script src="../node_modules/prismjs/components/prism-markdown.js"></script>
  <script src="../node_modules/prismjs/components/prism-go.js"></script>
  <script src="../node_modules/prismjs/components/prism-rust.js"></script>
  <script src="../node_modules/prismjs/components/prism-java.js"></script>
  <script src="../node_modules/prismjs/components/prism-c.js"></script>
  <script src="../node_modules/prismjs/components/prism-cpp.js"></script>

  <script src="syntax-highlight.js"></script>
  <script src="i18n.js"></script>
  <script src="themes.js"></script>
  <script src="tabs-state.js"></script>
  <script src="tabs.js"></script>
  <script src="launchers.js"></script>
  <script src="command-palette.js"></script>
  <script src="search.js"></script>
  <script src="suggest-view-state.js"></script>
  <script src="suggest.js"></script>
  <script src="settings.js"></script>
  <script src="update-popup.js"></script>
  <script src="shortcuts.js"></script>
  <script src="file-tree.js"></script>
  <script src="file-viewer.js"></script>
  <script src="claude-panel.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
