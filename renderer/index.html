<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="script-src 'self'">
  <title>Yami Term</title>
  <link rel="stylesheet" href="../node_modules/@xterm/xterm/css/xterm.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="titlebar">
    <div class="drag-region"></div>
    <div id="tab-bar" class="tab-bar"></div>
    <button id="new-tab-btn" class="new-tab-btn">+</button>
    <button id="claude-launch-btn" class="claude-launch-btn" title="Claude Codeを起動">🤖</button>
    <button id="settings-btn" class="settings-btn">⚙</button>
  </div>

  <div id="terminals" class="terminals"></div>

  <div id="settings-modal" class="settings-modal hidden">
    <!-- settings.js が構築する -->
  </div>

  <div id="suggest-layer" class="suggest-layer" style="display: none;">
    <!-- suggest.js が構築する -->
  </div>

  <script src="../node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <script src="../node_modules/@xterm/addon-web-links/lib/addon-web-links.js"></script>

  <script src="i18n.js"></script>
  <script src="themes.js"></script>
  <script src="tabs-state.js"></script>
  <script src="tabs.js"></script>
  <script src="suggest-view-state.js"></script>
  <script src="suggest.js"></script>
  <script src="settings.js"></script>
  <script src="shortcuts.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
