name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
        shell: bash

      - run: npm test
        shell: bash

      - name: Smoke test (Electron launch)
        shell: bash
        env:
          YAMI_TERM_SMOKE: "1"
        run: |
          set -e
          npm start > smoke.log 2>&1
          cat smoke.log
          grep -q "SMOKE_OK" smoke.log

      - run: bash scripts/check-wiring.sh
        shell: bash

      - run: bash scripts/check-i18n.sh
        shell: bash
