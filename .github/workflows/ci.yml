name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
        shell: bash

      - run: npm test
        shell: bash

      - run: bash scripts/check-wiring.sh
        shell: bash

      - run: bash scripts/check-i18n.sh
        shell: bash
